<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо-рандомайзер: 1 или 2</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 20%, #2b2f45, #14161f 70%);
    color: #eef1f8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; user-select: none; overflow: hidden;
  }
  .wrap { position: relative; }
  canvas {
    display: block; border-radius: 50%; max-width: 86vw; height: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 10px #1c1f2b, 0 0 0 13px #33384d;
    cursor: pointer;
  }
  .pointer {
    position: absolute; left: 50%; top: -16px; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 32px solid #ffcc33;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.6));
    z-index: 2;
  }
  #result { font-size: 64px; font-weight: 800; line-height: 1; min-height: 64px; transition: color .15s; }
  #result.one { color: #9fe3ff; }
  #result.two { color: #ff6b6b; }
  #hint { opacity: .75; font-size: 15px; text-align: center; padding: 0 12px; }
  #counter { font-size: 14px; opacity: .6; }
</style>
</head>
<body>

  <div class="wrap" id="wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="560" height="560"></canvas>
  </div>

  <div id="result">—</div>
  <div id="hint">Кликни <b>правой кнопкой мыши</b> по колесу, чтобы крутить</div>
  <div id="counter">До следующей «2»: 20 прокруток</div>

<script>
const canvas    = document.getElementById('wheel');
const ctx       = canvas.getContext('2d');
const wrap      = document.getElementById('wrap');
const resultEl  = document.getElementById('result');
const counterEl = document.getElementById('counter');

const N = 20;                       // всего секторов
const SEG = Math.PI * 2 / N;        // угол одного сектора (18°)
const TWO_INDEX = 0;                // в этом секторе нарисована «2»

let rot = -Math.PI / 2;             // текущий поворот колеса
let spinning = false;
let spinCount = 0;                  // сколько раз уже крутили

/* ---------- отрисовка колеса ---------- */
function draw() {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const R = Math.min(cx, cy) - 8;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < N; i++) {
    const a0 = rot + i * SEG;
    const a1 = a0 + SEG;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a0, a1);
    ctx.closePath();

    if (i === TWO_INDEX)      ctx.fillStyle = '#e0453f';
    else if (i % 2 === 0)     ctx.fillStyle = '#f4f6fb';
    else                      ctx.fillStyle = '#dfe3ee';
    ctx.fill();

    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0,0,0,.15)';
    ctx.stroke();

    // цифра внутри сектора
    const mid = a0 + SEG / 2;
    const tx = cx + Math.cos(mid) * R * 0.8;
    const ty = cy + Math.sin(mid) * R * 0.8;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.fillStyle = (i === TWO_INDEX) ? '#ffffff' : '#3a3f55';
    ctx.fillText(i === TWO_INDEX ? '2' : '1', 0, 0);
    ctx.restore();
  }

  // ступица
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.13, 0, Math.PI * 2);
  ctx.fillStyle = '#2a2e3d';
  ctx.fill();
  ctx.strokeStyle = '#454b60';
  ctx.lineWidth = 3;
  ctx.stroke();
}

/* ---------- вспомогательное ---------- */
function plural(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return 'прокрутка';
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'прокрутки';
  return 'прокруток';
}

function showResult(v) {
  resultEl.textContent = String(v);
  resultEl.className = (v === 2) ? 'two' : 'one';

  const left = 20 - (spinCount % 20);
  counterEl.textContent = 'До следующей «2»: ' + left + ' ' + plural(left);
}

/* ---------- прокрутка ---------- */
function spin() {
  if (spinning) return;
  spinning = true;

  resultEl.textContent = '…';
  resultEl.className = '';

  spinCount++;
  const willBeTwo = (spinCount % 20 === 0);   // каждая 20-я прокрутка даёт «2»

  // выбираем сектор, на который должно указать колесо
  let target;
  if (willBeTwo) {
    target = TWO_INDEX;
  } else {
    const ones = [];
    for (let i = 0; i < N; i++) if (i !== TWO_INDEX) ones.push(i);
    target = ones[Math.floor(Math.random() * ones.length)];
  }

  // лёгкий случайный сдвиг внутри сектора — чтобы не всегда в самый центр
  const jitter = (Math.random() - 0.5) * SEG * 0.7;

  // поворот, при котором центр сектора target окажется под указателем (сверху, -90°)
  const desired = -Math.PI / 2 - (target + 0.5) * SEG - jitter;

  const startRot = rot;
  const turns = 6 + Math.floor(Math.random() * 3);          // 6–8 полных оборотов
  const minEnd = startRot + turns * Math.PI * 2;
  const k = Math.ceil((minEnd - desired) / (Math.PI * 2));
  const endRot = desired + k * Math.PI * 2;

  const duration = 3000 + Math.random() * 700;
  const t0 = performance.now();

  function frame(now) {
    const p = Math.min((now - t0) / duration, 1);
    const e = 1 - Math.pow(1 - p, 3);                        // плавное торможение
    rot = startRot + (endRot - startRot) * e;
    draw();

    if (p < 1) {
      requestAnimationFrame(frame);
    } else {
      rot = endRot % (Math.PI * 2);
      draw();
      spinning = false;
      showResult(willBeTwo ? 2 : 1);
    }
  }

  requestAnimationFrame(frame);
}

/* ---------- события ---------- */
// правый клик — крутим, контекстное меню не показываем
wrap.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  spin();
});
// на всякий случай: пробел тоже крутит
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); spin(); }
});

draw();
</script>
</body>
</html>
